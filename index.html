function navButton(route,label,n){return `<button class="nav-item ${view===route?'active':''}" data-view="${route}">${icon(n)}<span>${label}</span>${view===route?'<span class="nav-dot"></span>':''}</button>`;}
function render(){
 document.body.classList.toggle('mobile-chat',view==='chat');updateViewport();
 const {character,world,thread}=scope(),model=modelSettings(),provider=providerCatalog().find(p=>p.id===model.provider);
 const oldSidebar=$('.sidebar-scroll'),sidebarScrollTop=oldSidebar?.dataset.scope===world.id?oldSidebar.scrollTop:0;
 document.documentElement.style.setProperty('--message-size',w().settings.fontSize+'px');

 <div class="thread-list">${threads.map(t=>`<button class="thread ${t.id===thread?.id?'selected':''}" data-thread="${t.id}"><span>${icon('chat')}</span><div>${esc(t.title)}<small>${roomLabel(t)} · ${date(t.updatedAt,{month:'short',day:'numeric'})}${unread.has(t.id)?' · 未讀':''}</small></div></button>`).join('')||'<div class="list-empty">還沒有對話，<br>從一句話開始就好。</div>'}</div></div>
 <div class="sidebar-bottom">${navButton('settings','設定與備份','settings')}<div class="local-status"><i></i>留在這台裝置 <span>v0.2.7</span></div></div></aside>

function quoteBlock(message){
 return `<blockquote class="quoted-message">${esc(message.content.slice(0,140))}${message.content.length>140?'…':''}</blockquote>`;
}
function messageBubble(message,character,byId){
 const received=message.role==='assistant';
 const quote=byId.get(message.replyTo);
 const time=date(message.createdAt);
 const media=message.image?`<img class="chat-media" src="${esc(message.image)}" alt="${message.kind==='sticker'?'貼圖':'照片'}">`:'';
 const label=message.kind==='photo'&&message.content==='傳了一張照片。'||message.kind==='sticker'&&message.image?'':esc(message.content);
 return `<article class="im-row ${received?'incoming':'outgoing'}">${received?avatar(character,'im-avatar'):w().settings.playerAvatar?avatar({name:playerDisplay(w().settings),avatar:w().settings.playerAvatar},'im-avatar'):''}
 <div class="im-content">${quote?quoteBlock(quote):''}<div class="im-bubble ${message.kind==='sticker'?'im-sticker':''}">${media}${label}</div>
 <button type="button" class="quote-action" data-quote="${message.id}" aria-label="引用這則訊息">引用</button></div>
 <div class="im-meta">${!received&&message.readAt?`<span>已讀</span>`:''}${message.mock?'<span>示範</span>':''}<time>${esc(time)}</time></div></article>`;
}

 <div class="im-composer-wrap"><form id="compose-form" class="im-composer">

 <div class="im-tools">

 <input id="chat-photo-file" type="file" accept="image/*" hidden></div>

 <button class="send-button" type="submit" aria-label="送出訊息">${icon('send')}</button></form></div></section>`;
}
function periodCalendar(records){
 const today=LittleLife.localDate();
 const base=periodMonth||new Date();
 const month=new Date(base.getFullYear(),base.getMonth(),1,12);
 const first=month.getDay();
 const days=new Date(month.getFullYear(),month.getMonth()+1,0,12).getDate();
 const active=new Set(records.filter(row=>row.metric==='period'&&Number(row.value)===1).map(row=>row.date));
 const label=month.toLocaleDateString('zh-TW',{year:'numeric',month:'long'});
 const cells=Array.from({length:days},(_,index)=>{
  const day=index+1;
  const date=LittleLife.localDate(new Date(month.getFullYear(),month.getMonth(),day,12));
  return `<button class="calendar-day" type="button" data-period-date="${date}" aria-label="${date} 經期" aria-pressed="${active.has(date)}"${date===today?' aria-current="date"':''}>${day}</button>`;
 }).join('');
 return `<section class="life-card period-calendar"><h2>經期日曆</h2>
 <div class="calendar-header">
 <button type="button" class="icon-btn" aria-label="上個月" data-period-month="-1">‹</button>
 <strong aria-live="polite">${esc(label)}</strong>
 <button type="button" class="icon-btn" aria-label="下個月" data-period-month="1">›</button></div>
 <div class="calendar-grid">${['日','一','二','三','四','五','六'].map(day=>`<span aria-hidden="true">${day}</span>`).join('')}
 ${'<span aria-hidden="true"></span>'.repeat(first)}${cells}</div>
 <p class="hint">點日期標記經期，再點同一天取消。紀錄留在此裝置，可隨完整備份匯出。</p></section>`;
}
function restoreCalendarPosition(scrollTop,selector){
 const pane=$('.life-page');
 if(pane)pane.scrollTop=scrollTop;
 $(selector)?.focus({preventScroll:true});
}
function lifePage(route,character,world){
 const life=w().life;
 if(route==='records'){
  const dateValue=LittleLife.localDate();
  const chart=Object.entries(LittleLife.metrics).map(([id,[label,unit]])=>{
   const rows=life.records.filter(row=>row.metric===id).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
   const latest=rows[0],goal=Math.max(1,Number(life.waterGoal)||2000);
   const percent=latest?Math.round(Number(latest.value)/goal*100):0;
   const action=row=>`<div class="metric-actions"><button type="button" class="button secondary" data-record-edit="${id}:${esc(row.date)}">編輯</button><button type="button" class="button secondary" data-record-delete="${id}:${esc(row.date)}">刪除</button></div>`;
   const history=rows.slice(1);
   const trend=id==='water'?'':LittleLife.trend(rows,dateValue);
   return `<section class="life-card metric-card"><div class="metric-heading"><h3><span aria-hidden="true">${({water:'💧',sleep:'☾',weight:'⚖'})[id]}</span> ${label}</h3>${latest?`<time>${esc(latest.date)}</time>`:''}</div>${latest?`<div class="metric-main"><strong>${esc(latest.value)}</strong><span>${id==='water'?'/ '+esc(goal)+' mL':unit}</span>${id==='water'?`<small>${percent}%</small>`:''}</div>${id==='water'?`<div class="water-track" role="progressbar" aria-label="飲水目標" aria-valuemin="0" aria-valuemax="${goal}" aria-valuenow="${Math.min(goal,Math.max(0,Number(latest.value)||0))}"><span style="width:${Math.min(100,Math.max(0,percent))}%"></span></div>`:trend}${action(latest)}${history.length?`<details class="metric-history"><summary>歷史紀錄（${history.length} 筆）</summary>${history.map(row=>`<div class="metric-history-row"><time>${esc(row.date)}</time><strong>${esc(row.value)} ${unit}</strong>${action(row)}</div>`).join('')}</details>`:''}`:'<p class="hint">還沒有紀錄</p>'}</section>`;
  }).join('');
  return `<section class="page-scroll life-page"><h1>我的紀錄</h1>${periodCalendar(life.records)}<form id="water-goal-form" class="life-card"><label class="field">每日飲水目標（mL）<input type="number" name="goal" inputmode="numeric" min="100" max="20000" value="${life.waterGoal||2000}" required></label><button class="button secondary">儲存目標</button></form><form id="record-form" class="life-card">
  <label class="field">日期<input name="date" type="date" value="${dateValue}" required></label>
  <label class="field">項目<select name="metric">${Object.entries(LittleLife.metrics).map(([id,[label,unit]])=>`<option value="${id}">${label}${unit?'（'+unit+'）':''}</option>`).join('')}</select></label>
  <label class="field" id="record-value-label">數值<input name="value" inputmode="decimal" type="number" min="0" max="20000" step="any" required></label>
  <button class="button primary" type="submit">儲存</button></form>${chart}</section>`;
 }
 const posts=life.posts.filter(row=>row.worldId===world.id);
 const diary=life.diaries.filter(row=>row.worldId===world.id);
 const events=life.events.filter(row=>row.worldId===world.id);
 const groups=life.groups.filter(row=>row.worldId===world.id);
 return `<section class="page-scroll life-page"><h1>角色日常</h1><p>${esc(character.name)} · ${esc(world.name)}</p>
 ${lifeArchive('posts',posts,world.id)}
 ${lifeArchive('diaries',diary,world.id)}
 <section class="life-card"><h2>開啟小倉庫時自動更新</h2><form id="routine-form">
 <label class="checkbox"><input type="checkbox" name="post" ${world.dailyPost===true?'checked':''}>每天讓角色發一則動態</label>
 <label class="checkbox"><input type="checkbox" name="diary" ${world.dailyDiary===true?'checked':''}>每天讓角色寫一篇日記</label>
 <label class="checkbox"><input type="checkbox" name="lifeAccess" ${world.lifeAccess===true?'checked':''}>允許此世界的角色在私聊讀取經期、喝水、睡眠紀錄</label><p class="hint">啟用後，近期紀錄會傳送給選定的 API；不提供給群聊、動態或日記。</p><button class="button secondary" type="submit">儲存自動更新</button></form></section>
 <section class="life-card"><h2>行程與紀念日</h2><button class="button secondary" data-action="new-event">新增日期或行程</button>
 ${events.map(row=>`<p><time>${esc(row.date)}</time> ${esc(row.text)}${row.annual===true?' · 每年':''}</p>`).join('')}</section>
 <section class="life-card"><h2>角色群聊</h2><button class="button secondary" data-action="new-group">建立群聊</button>
 ${groups.map(group=>`<article><h3>${esc(group.title)}</h3>${group.messages.slice(-20).map(message=>`<p><strong>${esc(message.author)}</strong> ${esc(message.text)}</p>`).join('')}
 <button class="button secondary" data-group-send="${esc(group.id)}">傳訊</button>
 <button class="button secondary" data-group-roles="${esc(group.id)}">讓角色自己聊</button><button class="button secondary" data-group-manage="${esc(group.id)}">管理群聊</button></article>`).join('')}</section>
 <section class="life-card"><h2>虛擬錢包</h2><p>餘額 ${LittleLife.points(w())} 點</p><button class="button secondary" data-action="ask-gift">跟角色討禮物</button>
 ${life.wallet.slice(-10).reverse().map(row=>`<p>${esc(LittleLife.cleanText(row.text))}${row.amount?` · ${row.amount>0?'+':''}${esc(row.amount)} 點`:''}</p>`).join('')}</section></section>`;
}
const archiveStates=new Map();
function archiveState(key,worldId=scope().world.id){const id=worldId+':'+key;if(!archiveStates.has(id))archiveStates.set(id,{month:LittleLife.localDate().slice(0,7),open:true,manage:false,selected:new Set()});return archiveStates.get(id);}
function archiveRows(key,worldId=scope().world.id){const state=archiveState(key,worldId);return w().life[key].filter(r=>r.worldId===worldId&&String(r.date).slice(0,7)===state.month).sort((a,b)=>String(b.date).localeCompare(String(a.date)));}
function lifeArchive(key,all,worldId){const st=archiveState(key,worldId),rows=archiveRows(key,worldId),post=key==='posts',title=post?'動態':'角色日記';const months=[...new Set([LittleLife.localDate().slice(0,7),st.month,...all.map(r=>String(r.date).slice(0,7)).filter(x=>/^\d{4}-\d{2}$/.test(x))])].sort().reverse();return `<details class="life-card archive-section" data-archive-section="${key}" ${st.open?'open':''}><summary><strong>${title}</strong> <span class="hint">${all.length} 篇</span></summary><div class="button-row"><button class="button secondary" data-action="export-${key}">匯出本世界${title}</button>${post?'<button class="button secondary" data-action="new-post">發動態</button><button class="button secondary" data-action="role-post">讓角色發動態</button>':'<button class="button secondary" data-action="role-diary">寫一篇／重新生成今日日記</button>'}</div><div class="archive-toolbar"><label>月份 <select data-archive-month="${key}">${months.map(m=>`<option ${m===st.month?'selected':''} value="${esc(m)}">${esc(m)}</option>`).join('')}</select></label><button class="button secondary" data-archive-manage="${key}">${st.manage?'完成':'管理'}</button></div>${st.manage?`<div class="archive-toolbar"><label class="checkbox"><input type="checkbox" data-archive-all="${key}" ${rows.length&&rows.every(r=>st.selected.has(r.id))?'checked':''}>本月全選</label><button class="button secondary" data-archive-export="${key}">匯出所選</button><button class="button secondary" data-archive-delete="${key}">刪除所選（${st.selected.size}）</button></div>`:''}${rows.map(row=>`<article>${st.manage?`<label class="checkbox"><input type="checkbox" data-archive-check="${key}" data-row-id="${esc(row.id)}" ${st.selected.has(row.id)?'checked':''}>選取</label>`:''}<details class="diary-entry"><summary><time>${esc(row.date)}</time> ${esc(row.author||'')}<span class="diary-preview">${esc(LittleLife.cleanText(row.text).slice(0,65))}${LittleLife.cleanText(row.text).length>65?'…':''}</span></summary><p>${esc(LittleLife.cleanText(row.text))}</p>${post?`${(row.comments||[]).map(c=>`<p class="life-comment"><strong>${esc(c.author)}</strong> ${esc(c.text)}</p>`).join('')}<button class="button secondary" data-life-comment="${esc(row.id)}">留言</button><button class="button secondary" data-life-role-comment="${esc(row.id)}">讓角色留言</button>`:''}${lifeEditButtons(key,row)}</details></article>`).join('')||'<p class="hint">本月沒有紀錄</p>'}</details>`;}
function refreshArchive(){const top=$('.life-page')?.scrollTop||0;render();if($('.life-page'))$('.life-page').scrollTop=top;}
function bindArchives(){for(const el of document.querySelectorAll('[data-archive-section]'))el.ontoggle=()=>{archiveState(el.dataset.archiveSection).open=el.open;};for(const el of document.querySelectorAll('[data-archive-month]'))el.onchange=()=>{if(busy)return;const st=archiveState(el.dataset.archiveMonth);st.month=el.value;st.selected.clear();refreshArchive();};for(const el of document.querySelectorAll('[data-archive-manage]'))el.onclick=()=>{if(busy)return;const st=archiveState(el.dataset.archiveManage);st.manage=!st.manage;st.selected.clear();refreshArchive();};for(const el of document.querySelectorAll('[data-archive-check]'))el.onchange=()=>{const st=archiveState(el.dataset.archiveCheck);if(el.checked)st.selected.add(el.dataset.rowId);else st.selected.delete(el.dataset.rowId);refreshArchive();};for(const el of document.querySelectorAll('[data-archive-all]'))el.onchange=()=>{const key=el.dataset.archiveAll,st=archiveState(key);st.selected=new Set(el.checked?archiveRows(key).map(r=>r.id):[]);refreshArchive();};for(const el of document.querySelectorAll('[data-archive-export],[data-archive-delete]'))el.onclick=async()=>{if(busy)return;const key=el.dataset.archiveExport||el.dataset.archiveDelete,worldId=scope().world.id,st=archiveState(key),rows=archiveRows(key).filter(r=>st.selected.has(r.id));if(!rows.length){toast('請先選取紀錄。');return;}if(el.dataset.archiveExport){await exportText('little-'+key+'-'+st.month+'.md',rows.slice().reverse().map(r=>'## '+r.date+' · '+(r.author||'')+'\n\n'+r.text+'\n'+(r.comments||[]).map(c=>c.author+'：'+c.text).join('\n')).join('\n\n'));return;}const ids=new Set(rows.map(r=>r.id));modal('批次刪除',`<p>確定刪除所選 ${rows.length} 篇？此操作無法復原。</p>`,{label:'刪除',danger:true,submit:async()=>{if(!await change(d=>{d.life[key]=d.life[key].filter(r=>r.worldId!==worldId||!ids.has(r.id));},'已刪除所選紀錄。'))throw Error('刪除失敗。');st.selected.clear();refreshArchive();}});};}
function lifeEditButtons(key,row){return `<button class="button secondary" data-life-edit="${key}:${esc(row.id)}">編輯</button><button class="button secondary" data-life-delete="${key}:${esc(row.id)}">刪除</button>`;}
function bindLife(){
 bindArchives();
 const goal=$('#water-goal-form');if(goal)goal.onsubmit=async e=>{e.preventDefault();await change(d=>{d.life.waterGoal=Number(new FormData(goal).get('goal'));},'飲水目標已儲存。');};
 for(const b of document.querySelectorAll('[data-life-edit],[data-life-delete]'))b.onclick=()=>{
  const [key,id]=(b.dataset.lifeEdit||b.dataset.lifeDelete).split(':');const row=w().life[key].find(r=>r.id===id);if(!row)return;
  if(b.dataset.lifeDelete)modal('刪除紀錄','<p>確定刪除這則紀錄？</p>',{label:'刪除',danger:true,submit:async()=>{if(!await change(d=>{d.life[key]=d.life[key].filter(r=>r.id!==id);}))throw Error('刪除失敗。');}});
  else modal('編輯紀錄',inputField('內容','text',row.text,5),{submit:async f=>{const text=String(f.get('text')).trim();if(!text)throw Error('請輸入內容。');if(!await change(d=>{d.life[key].find(r=>r.id===id).text=text;}))throw Error('儲存失敗。');}});
 };

 for(const button of document.querySelectorAll('[data-period-month]')){
  button.onclick=()=>{
   const step=Number(button.dataset.periodMonth),scrollTop=$('.life-page').scrollTop;
   const base=periodMonth||new Date();
   periodMonth=new Date(base.getFullYear(),base.getMonth()+step,1,12);
   render();
   restoreCalendarPosition(scrollTop,'[data-period-month="'+step+'"]');
  };
 }
 for(const button of document.querySelectorAll('[data-period-date]')){

async function lifeText(workspace,instruction,character,history=[]){
 const model=modelSettings(),provider=C.providers.get(model.provider);
 if(model.provider==='mock')return '（示範）'+character.name+'：今天想把這件小事記下來。';
 const request=C.context(workspace);
 request.lifeMode=true;request.phoneMode=history.length>0;delete request.lifeSummary;
 request.character={name:character.name,persona:character.persona};
 if(character.id!==workspace.selected.characterId||history.length){
  request.world={name:'群聊'};
  request.references=[];request.messages=history;
 }
 request.messages=request.messages.map(({role,content})=>({role,content}));
 request.request.maxOutputTokens=600;
 request.messages.push({role:'user',content:instruction+'\n目前裝置日期：'+LittleLife.localDate()+'。請不要複製範例日期或帳號；日記不必在正文重複日期，動態只寫正文。'});
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),35000);
 try{
  const result=await C.generateWithRetry(provider,request,{signal:controller.signal,model:model.model});
  if(!result.content.trim())throw Error('角色沒有回覆。');
  return LittleLife.cleanText(result.content).slice(0,2000);
 }finally{clearTimeout(timer);}
}
async function commentOnPost(id,role){
 const {character}=scope(),post=w().life.posts.find(row=>row.id===id);
 if(!post||busy)return;
 const append=(d,author,text)=>d.life.posts.find(row=>row.id===id).comments.push({author,text});
 if(role){
  await change(async d=>append(d,character.name,await lifeText(d,'請對這則動態留一則簡短留言：'+post.text,character)),'留言已加入。');
  return;
 }
 modal('留言',inputField('留言','text'),{submit:async data=>{

function groupMessage(id,rolesOnly){
 if(busy)return;
 const send=async text=>{
  if(!await change(async d=>{
   const group=d.life.groups.find(row=>row.id===id);
   if(text)group.messages.push({author:playerDisplay(d.settings),text,role:'user'});
   for(const member of group.members){
    const character=d.characters.find(c=>c.id===member);
    if(!character)continue;
    const history=group.messages.slice(-14).map(row=>({role:'user',content:row.author+'：'+row.text}));
    if(!history.length)history.push({role:'user',content:'群聊剛開始。'});
    const answer=await lifeText(d,'你正在群聊。依據群聊內容發一則自然的訊息。',character,history);
    group.messages.push({author:character.name,text:answer,role:'assistant'});
   }
  }))throw Error('沒有存好群聊。');
 };
 if(rolesOnly){send('').catch(()=>{});return;}
 modal('群聊訊息',inputField('輸入訊息','text'),{submit:data=>send(String(data.get('text')).trim())});
}

let dailyAttempt='';
async function runDailyLife(){
 if(!service||busy||document.hidden||$('#modal').open)return;
 const {world,character}=scope(),today=LittleLife.localDate();
 if(!world.dailyPost&&!world.dailyDiary)return;
 const key=world.id+':'+today;
 if(dailyAttempt===key)return;
 const tasks=[];
 if(world.dailyPost&&!w().life.posts.some(row=>row.worldId===world.id&&row.date===today&&row.automatic===true&&!LittleLife.isDemo(row))){
  tasks.push(['posts','請發一則短短的日常動態。']);
 }
 if(world.dailyDiary&&!w().life.diaries.some(row=>row.worldId===world.id&&row.date===today&&!LittleLife.isDemo(row))){
  tasks.push(['diaries','請寫今天的一小段第一人稱日記。']);
 }
 if(!tasks.length)return;
 dailyAttempt=key;
 for(const [collection,instruction] of tasks){
  if(scope().world.id!==world.id||document.hidden)break;
  await change(async d=>{
   const text=await lifeText(d,instruction,character);
   d.life[collection].push({id:C.id(),worldId:world.id,author:character.name,date:today,text,automatic:true,comments:[]});
  });
 }
}
async function lifeAction(name,character,world){
 const worldId=world.id,today=LittleLife.localDate();
 const worldRow=(d,key,values)=>d.life[key].push({id:C.id(),worldId,...values});
 if(name==='new-post'){
  modal('發動態',inputField('內容','text','',4),{submit:async data=>{
   const text=String(data.get('text')).trim().slice(0,2000);if(!text)throw Error('請輸入內容。');
   if(!await change(d=>worldRow(d,'posts',{author:playerDisplay(d.settings),text,comments:[]})))throw Error('沒有存好動態。');
  }});return true;
 }
 if(name==='role-post'||name==='role-diary'){
  const diary=name==='role-diary',key=diary?'diaries':'posts';
  if(diary&&w().life.diaries.some(row=>row.worldId===worldId&&row.date===today&&!LittleLife.isDemo(row))&&!confirm('重新生成並取代今天的日記？'))return true;
  await change(async d=>{
   const text=await lifeText(d,diary?'請寫今天的一小段第一人稱私密日記。':'請發一則簡短的日常動態。',character);
   if(diary)d.life.diaries=d.life.diaries.filter(row=>row.worldId!==worldId||row.date!==today);
   worldRow(d,key,{author:character.name,text,date:today,comments:[]});
  },diary?'日記已存好。':'動態已發出。');return true;
 }
 if(name==='new-event'){
  modal('新增行程或紀念日',`<label class="field">日期<input type="date" name="date" value="${today}" required></label>`+inputField('名稱','text')+'<label class="checkbox"><input type="checkbox" name="annual">每年紀念日</label>',{
   submit:async data=>{if(!await change(d=>worldRow(d,'events',{date:data.get('date'),text:String(data.get('text')).trim(),annual:data.has('annual')})))throw Error('沒有存好行程。');}
  });return true;
 }
 if(name==='new-group'){
  if(w().characters.length<2){toast('先在「角色與世界」建立至少兩個角色。');return true;}
  const choices=w().characters.map(c=>`<label class="checkbox"><input type="checkbox" name="member" value="${esc(c.id)}"> ${esc(c.name)}</label>`).join('');
  modal('建立群聊',inputField('群聊名稱','title')+choices,{submit:async data=>{
   const members=data.getAll('member');
   if(members.length<2||members.length>4)throw Error('請選 2 到 4 位角色。');
   if(!await change(d=>worldRow(d,'groups',{title:String(data.get('title')).trim(),members,messages:[]})))throw Error('沒有存好群聊。');
  }});return true;
 }
 if(name==='ask-gift'){
  modal('跟角色討禮物',inputField('想要什麼','gift'),{submit:async data=>{
   if(!await change(async d=>{
    const answer=await lifeText(d,'對方想要這個禮物：'+String(data.get('gift')).trim()+'。依角色設定自然回應。若你決定贈送虛擬點數，回覆最前面輸出 [送點數]，否則直接回覆。',character);
    const accepted=answer.startsWith('[送點數]');
    const text=(accepted?answer.slice('[送點數]'.length):answer).trim();
    const thread=C.scope(d).thread;
    if(thread){d.messages.push({id:C.id(),threadId:thread.id,role:'assistant',content:text,createdAt:C.now(),mock:modelSettings().provider==='mock'});thread.updatedAt=C.now();}
    d.life.wallet.push({text:accepted?'收到 '+character.name+' 的虛擬點數':'向 '+character.name+' 討禮物（未增加點數）',amount:accepted?10:0});
   }))throw Error('沒有存好禮物訊息。');
  }});return true;
 }
 return false;
}

function bind(){
 bindLife();
 document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{if(busy)return;retainDraft();view=b.dataset.view;drawer=false;render();if(view==='chat')markCurrentThreadRead();});
 document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));
 $('#character-select').onchange=e=>selectCharacter(e.target.value);
 if($('#world-select'))$('#world-select').onchange=e=>selectWorld(e.target.value);
 $('#thread-search').oninput=e=>{if(busy)return;const pos=e.target.selectionStart;search=e.target.value;retainDraft();render();$('#thread-search').focus();$('#thread-search').setSelectionRange(pos,pos);};
 document.querySelectorAll('[data-thread]').forEach(b=>b.onclick=async()=>{if(await change(d=>{d.selected.threadId=b.dataset.thread;markThreadRead(d,b.dataset.thread);})){view='chat';drawer=false;render();}});
 document.querySelectorAll('[data-world]').forEach(b=>b.onclick=()=>selectWorld(b.dataset.world));
 document.querySelectorAll('[data-prompt]').forEach(b=>b.onclick=()=>{$('#message-input').value=b.dataset.prompt;resizeInput();$('#message-input').focus();});
 for(const button of document.querySelectorAll('[data-quote]')){
  button.onclick=()=>{
   if(busy)return;
   retainDraft();
   replyDrafts.set(draftKey(),button.dataset.quote);
   render();
   $('#message-input').focus();
  };
 }
 if($('#clear-quote'))$('#clear-quote').onclick=()=>{
  if(busy)return;
  retainDraft();
  replyDrafts.delete(draftKey());
  render();
  $('#message-input').focus();
 };
 if($('#chat-photo-file'))$('#chat-photo-file').onchange=async e=>{
  const file=e.target.files[0];
  if(!file)return;
  const target=draftKey();
  try{const image=await resizeChatImage(file);if(target===draftKey())await submitMessage('傳了一張照片。',{kind:'photo',image});}
  catch(error){toast(error.message,true);}
 };
 if($('#compose-form')){$('#compose-form').onsubmit=send;$('#message-input').oninput=()=>{drafts.set(draftKey(),$('#message-input').value);resizeInput();};$('#message-input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229){e.preventDefault();send(e);}};}
 if($('#character-form')){$('#character-form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),cid=scope().character.id;await change(d=>Object.assign(d.characters.find(c=>c.id===cid),{name:String(f.get('name')).trim(),description:String(f.get('description')),persona:String(f.get('persona')),proactiveRules:String(f.get('proactiveRules')),pace:String(f.get('pace'))}),'角色資料已儲存');};$('#avatar-file').onchange=uploadAvatar;$('#reference-file').onchange=uploadReference;}
 document.querySelectorAll('[data-reference]').forEach(b=>b.onclick=()=>{const r=w().references.find(r=>r.id===b.dataset.reference);modal('參考資料 · '+r.name,`<pre class="context-text">${esc(r.content)}</pre>`,{label:'關閉'});});
 document.querySelectorAll('[data-remove-reference]').forEach(b=>b.onclick=async()=>{const r=w().references.find(r=>r.id===b.dataset.removeReference);if(await confirmDialog('移除參考資料？',`只移除「${esc(r.name)}」，不會刪除原始檔案。`,'移除'))await change(d=>{d.references=d.references.filter(x=>x.id!==r.id);},'參考資料已移除');});
 const customAPI=$('#custom-api-form');
 if(customAPI)customAPI.onsubmit=async event=>{

  const form=new FormData(customAPI),model=String(form.get('model')).trim();
  try{
   if(!/^[-a-zA-Z0-9_./:]{1,120}$/.test(model))throw Error('請輸入有效的模型 ID。');

 };
 if($('#gemini-key-form')){
  $('#gemini-key-form').onsubmit=async event=>{
   event.preventDefault();
   const form=new FormData(event.target);
   try{
    MoonlitWeb.saveKey(String(form.get('key')).trim(),form.has('remember'));
    if(modelSettings().provider!=='gemini'){

 const playerProfile=$('#player-profile-form');

 if($('#settings-form')){$('#settings-form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);await change(d=>{d.settings.fontSize=Number(f.get('fontSize'));},'偏好已儲存');};$('#backup-file').onchange=importBackup;$('#package-file').onchange=importPackage;}
 if($('#model-settings-form')){const providerSelect=$('#provider-select'),modelSelect=$('#model-select'),customInput=$('#custom-model-input');providerSelect.onchange=()=>{const p=providerCatalog().find(x=>x.id===providerSelect.value),models=p?.models||[];modelSelect.innerHTML=models.map((x,i)=>`<option value="${esc(x.id)}" ${i===0?'selected':''}>${esc(x.label)}</option>`).join('')+'<option value="__custom__">自訂 model ID…</option>';customInput.value='';};$('#model-settings-form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),selected=String(f.get('model')),custom=String(f.get('customModel')||'').trim(),chosen=selected==='__custom__'?custom:selected;if(!/^[-a-zA-Z0-9_.]{1,120}$/.test(chosen))throw toast('自訂 model ID 格式不正確。請只使用英數、-、_、.。',true);await change(d=>{d.settings.model=C.normalizeModelSettings({provider:String(f.get('provider')),model:chosen,contextMessages:Number(f.get('contextMessages')),retryCount:Number(f.get('retryCount')),maxOutputTokens:Number(f.get('maxOutputTokens'))});},'模型接線設定已儲存');};}
}
async function selectCharacter(cid){if(await change(d=>{const world=d.worlds.find(x=>x.characterId===cid);d.selected={characterId:cid,worldId:world.id,threadId:d.threads.filter(t=>t.worldId===world.id).sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt))[0]?.id||null};})){search='';drawer=false;render();markCurrentThreadRead();}}
async function selectWorld(wid){if(await change(d=>{const world=d.worlds.find(x=>x.id===wid);d.selected={characterId:world.characterId,worldId:wid,threadId:d.threads.filter(t=>t.worldId===wid).sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt))[0]?.id||null};})){search='';drawer=false;render();markCurrentThreadRead();}}
function markThreadRead(workspace,threadId){
 const thread=workspace.threads.find(t=>t.id===threadId);
 if(thread)delete thread.unread;
 for(const message of workspace.messages){
  if(message.threadId===threadId&&message.unread===true)delete message.unread;
 }
}
function markCurrentThreadRead(){
 const threadId=w().selected.threadId;
 if(view==='chat'&&(scope().thread?.unread===true||w().messages.some(m=>m.threadId===threadId&&m.unread===true))){
  return change(d=>markThreadRead(d,threadId));
 }
}
function resizeInput(){const t=$('#message-input');if(t){t.style.height='auto';t.style.height=Math.min(t.scrollHeight,160)+'px';}}
function scrollMessages(){requestAnimationFrame(()=>{const e=$('#messages');if(e)e.scrollTop=e.scrollHeight;});}
async function resizeChatImage(file,{transparent=false}={}){
 if(file.size>15000000)throw Error('請選擇 15 MB 以下的圖片。');
 const url=URL.createObjectURL(file),image=new Image();
 try{
  await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=()=>reject(Error('無法讀取圖片，請試一般 JPEG 或 PNG。'));image.src=url;});
  const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');
  for(const size of transparent?[450,330,240]:[960,720,520]){
   const scale=Math.min(1,size/Math.max(image.naturalWidth,image.naturalHeight));
   canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));
   canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));
   if(!transparent){ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);}
   ctx.drawImage(image,0,0,canvas.width,canvas.height);
   const value=transparent?canvas.toDataURL('image/png'):canvas.toDataURL('image/jpeg',.75);
   if(C.validImage(value))return value;
  }
  throw Error('照片壓縮後仍然太大。');
 }finally{URL.revokeObjectURL(url);}
}
async function send(event){
 event.preventDefault();
 const content=$('#message-input')?.value.trim();
 if(content)await submitMessage(content);
}
async function submitMessage(content,options={}){
 if(busy)return;
 retainDraft();
 const key=draftKey(),button=$('.send-button'),input=$('#message-input');
 sendError='';busy=true;
 const replyTo=options.proactive?undefined:replyDrafts.get(key);
 function pending(){
  const status=document.createElement('p');status.className='im-pending';status.setAttribute('role','status');status.textContent=scope().character.name+' 正在輸入…';
  $('#messages .message-column')?.append(status);scrollMessages();
  for(const control of document.querySelectorAll('.im-tools button'))control.disabled=true;
  const button=$('.send-button');if(button){button.type='button';button.innerHTML=icon('stop');button.setAttribute('aria-label','停止回覆');button.onclick=()=>service.cancel();}
 }
 pending();
 try{
  await service.send(content,{modelOverride:modelSettings(),replyTo,...options,onCommitted:()=>{
   if(!options.proactive&&!options.kind){drafts.delete(key);drafts.delete(draftKey());replyDrafts.delete(key);}
   if(options.kind)replyDrafts.delete(key);
   render();pending();
  }});
 }catch(error){
  if(error?.code==='cancelled')toast('已停止回覆。');
  else sendError=error.message||'模型回覆失敗。';
 }finally{retainDraft();busy=false;render();}

function showStickers(){
 const custom=w().settings.customStickers;
 modal('貼圖',`<h3>內建貼圖</h3><div class="sticker-grid">${BUILTIN_STICKERS.map((item,index)=>`<button type="button" data-built-in="${index}" aria-label="${esc(item.label)}"><img src="${item.image}" alt="${esc(item.label)}"></button>`).join('')}</div><h3>表情與自訂貼圖</h3><div class="sticker-grid">${C.stickers.map((label,index)=>`<button type="button" data-sticker="${index}" aria-label="傳送貼圖 ${label}">${label}</button>`).join('')}
 ${custom.map((image,index)=>`<button type="button" data-custom-sticker="${index}" aria-label="傳送自製貼圖 ${index+1}"><img src="${esc(image)}" alt=""></button>`).join('')}</div>
 <label class="field">加入自製貼圖<input type="file" accept="image/*" id="custom-sticker-file"></label>`,{label:'關閉',cancel:false});
 for(const button of document.querySelectorAll('[data-sticker],[data-custom-sticker],[data-built-in]'))button.onclick=()=>{
  $('#modal').close();
  const built=BUILTIN_STICKERS[button.dataset.builtIn];
  if(built){submitMessage('傳了一張貼圖：'+built.label,{kind:'sticker',image:built.image});return;}
  const index=button.dataset.customSticker;
  submitMessage(index===undefined?C.stickers[button.dataset.sticker]:'傳了一張自製貼圖。',{kind:'sticker',image:custom[index]});
 };
 $('#custom-sticker-file').onchange=async event=>{
  const file=event.target.files[0];if(!file)return;
  try{
   const image=await resizeChatImage(file,{transparent:true});
   if(custom.length>=12)throw Error('自製貼圖最多可存 12 張。');
   if(await change(d=>{d.settings.customStickers.push(image);},'已加入貼圖。'))showStickers();
  }catch(error){toast(error.message,true);}
 };
}
function showGifts(){
 modal('送個禮物',`<label class="field">挑選禮物<select name="gift">${C.gifts.map(gift=>`<option value="${esc(gift)}">${esc(gift)} · 5 點</option>`).join('')}</select></label>`,
 {label:'送出',submit:form=>{if(LittleLife.points(w())<5)throw Error('虛擬點數不足。');const gift=form.get('gift');queueMicrotask(()=>submitMessage('🎁 '+gift,{kind:'gift'}));}});
}
function modal(title,body,{label='儲存',submit,cancel=true,wide=false,danger=false}={}){
 const d=$('#modal');if(d.open)d.close('cancel');d.returnValue='cancel';d.oncancel=()=>{d.returnValue='cancel';};d.className=wide?'wide-dialog':'';d.innerHTML=`<form id="modal-form"><div class="dialog-heading"><h2>${esc(title)}</h2><button type="button" class="icon-btn" id="modal-close" aria-label="關閉">${icon('close')}</button></div><div class="dialog-body">${body}</div><div class="dialog-footer">${cancel?'<button class="button secondary" type="button" id="modal-cancel">取消</button>':''}<button class="button ${danger?'danger-solid':'primary'}" type="submit">${esc(label)}</button></div></form>`;
 const close=()=>d.close('cancel');$('#modal-close').onclick=close;if($('#modal-cancel'))$('#modal-cancel').onclick=close;
 $('#modal-form').onsubmit=async e=>{e.preventDefault();const button=e.submitter;button.disabled=true;try{if(submit)await submit(new FormData(e.target));d.close('ok');}catch(err){toast(err.message,true);button.disabled=false;}};d.showModal();
}
function confirmDialog(title,body,label='確定'){return new Promise(resolve=>{modal(title,`<p>${body}</p>`,{label,submit:()=>{},danger:true});$('#modal').addEventListener('close',()=>resolve($('#modal').returnValue==='ok'),{once:true});});}
function inputField(label,name,value='',rows){return `<label class="field">${label}${rows?`<textarea name="${name}" rows="${rows}" maxlength="200000">${esc(value)}</textarea>`:`<input name="${name}" value="${esc(value)}" required maxlength="80">`}</label>`;}
function providerPayloadPreview(){
 const model=modelSettings(),workspace={...w(),settings:{...w().settings,model}},request=C.context(workspace),base={provider:model.provider,model:model.model,contextMessages:request.request.contextMessages,maxOutputTokens:request.request.maxOutputTokens};
 if(model.provider==='gemini'&&globalThis.MoonlitGemini?.buildGeminiRequest)return {...base,payload:MoonlitGemini.buildGeminiRequest(request,model.model)};
 return {...base,payload:request};
}
function exportStamp(){return new Date().toLocaleString('zh-TW');}
function exportDate(value){return date(value,{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false})||String(value||'');}
function sortedThreads(worldId){return w().threads.filter(t=>t.worldId===worldId).sort((a,b)=>String(a.createdAt).localeCompare(String(b.createdAt))||String(a.updatedAt).localeCompare(String(b.updatedAt)));}
function messagesForThread(threadId){return w().messages.filter(m=>m.threadId===threadId).sort((a,b)=>String(a.createdAt).localeCompare(String(b.createdAt)));}
function messageBlock(m,character,level='###'){return [level+' '+(m.role==='user'?playerDisplay(w().settings):character.name)+' · '+exportDate(m.createdAt),'',m.content,''].join('\n');}
function threadMarkdown(thread,character,world,{heading=1,includeMeta=true,includeTitle=true}={}){const prefix='#'.repeat(heading),rows=messagesForThread(thread.id),parts=[];if(includeTitle)parts.push(prefix+' '+thread.title,'');if(includeMeta)parts.push('角色：'+character.name,'世界：'+world.name,'形式：'+roomLabel(thread),'');if(!rows.length)parts.push('（這段對話目前沒有訊息。）','');else for(const m of rows)parts.push(messageBlock(m,character,'#'.repeat(Math.min(6,heading+(includeTitle?1:0)))));return parts.join('\n');}
function threadChapter(thread,character,world,index,total,heading){const rows=messagesForThread(thread.id),prefix='#'.repeat(heading),created=exportDate(thread.createdAt)||'—',updated=exportDate(thread.updatedAt)||created;return [prefix+' 聊天室 '+(index+1)+' / '+total+'｜'+thread.title,'','> 建立：'+created+'　｜　最近更新：'+updated+'　｜　'+roomLabel(thread)+'　｜　'+rows.length+' 則訊息','',threadMarkdown(thread,character,world,{heading:Math.min(6,heading+1),includeMeta:false,includeTitle:false})].join('\n');}
function worldMarkdown(character,world){const parts=['# '+character.name+'｜'+world.name,'','角色：'+character.name,'世界：'+world.name,'匯出時間：'+exportStamp(),''];const threads=sortedThreads(world.id);if(!threads.length)parts.push('（這個世界目前沒有對話。）','');else threads.forEach((t,i)=>{if(i)parts.push('','---','','## 下一個聊天室','');parts.push(threadChapter(t,character,world,i,threads.length,2),'');});return parts.join('\n');}
function characterMarkdown(character){const parts=['# '+character.name+'｜全部劇情','','角色：'+character.name,'匯出時間：'+exportStamp(),''];const worlds=w().worlds.filter(x=>x.characterId===character.id);worlds.forEach((world,wi)=>{if(wi)parts.push('','---','','# 下一個世界','');parts.push('## 世界 '+(wi+1)+' / '+worlds.length+'｜'+world.name,'');const threads=sortedThreads(world.id);if(!threads.length){parts.push('（這個世界目前沒有對話。）','');return;}threads.forEach((t,i)=>{if(i)parts.push('','---','','### 下一個聊天室','');parts.push(threadChapter(t,character,world,i,threads.length,3),'');});});return parts.join('\n');}
async function action(name){if(busy)return;
 if(name==='clear-player-avatar'){
  const form=$('#player-profile-form');
  const fields={displayName:form.elements.displayName.value,playerName:form.elements.playerName.value};
  if(await change(d=>{d.settings.playerAvatar='';},'已移除頭像。')){
   const updated=$('#player-profile-form');
   if(updated)for(const [name,value] of Object.entries(fields))updated.elements[name].value=value;
  }
  return;
 }
 if(name==='clear-custom-api'){
  try{LittleCustom.save('','',false);await change(d=>{if(d.settings.model.provider==='custom')d.settings.model={...d.settings.model,provider:'mock',model:'mock-fixed'};},'自訂 API 已清除。');}
  catch(error){toast(error.message,true);}
  return;
 }
 if(name==='clear-gemini-key'){
  try{MoonlitWeb.saveKey('',false);render();toast('Gemini 金鑰已清除。');}
  catch(error){toast(error.message,true);}
  return;
 }
 const {character,world,thread}=scope();
 if(name==='mark-unread'&&thread){
  await change(d=>{d.threads.find(t=>t.id===thread.id).unread=true;},'已標為未讀。');
  return;
 }
 if(name==='open-drawer'||name==='close-drawer'){retainDraft();drawer=name==='open-drawer';render();return;}
 if(name==='proactive'){await submitMessage('',{proactive:true});return;}
 if(name==='photo'){$('#chat-photo-file').click();return;}
 if(['new-post','role-post','role-diary','new-event','new-group','ask-gift'].includes(name)){await lifeAction(name,character,world);return;}
 if(name==='stickers'){showStickers();return;}
 if(name==='gifts'){showGifts();return;}
 if(name==='older-messages'&&thread){
  const pane=$('#messages'),height=pane.scrollHeight,top=pane.scrollTop;
  historyCount.set(thread.id,(historyCount.get(thread.id)||120)+120);
  retainDraft();render();
  requestAnimationFrame(()=>{const next=$('#messages');next.scrollTop=next.scrollHeight-height+top;});
  return;
 }
 if(name==='new-thread')modal('新增對話',inputField('對話名稱','title','新的對話'),{label:'建立',submit:async f=>{
  if(!await change(d=>{
   const t={id:C.id(),worldId:world.id,title:String(f.get('title')).trim()||'新的對話',roomType:'phone',maxOutputTokens:null,createdAt:C.now(),updatedAt:C.now()};
   d.threads.push(t);d.selected.threadId=t.id;
  }))throw Error('建立失敗');
  view='chat';drawer=false;render();
 }});
 if(name==='rename-thread')modal('重新命名對話',inputField('對話名稱','title',thread.title),{submit:async f=>{if(!await change(d=>{d.threads.find(t=>t.id===thread.id).title=String(f.get('title')).trim();},'名稱已更新'))throw Error('沒有儲存成功，請稍後再試。');}});
 if(name==='delete-thread'&&await confirmDialog('刪除這段對話？','「'+esc(thread.title)+'」和其中的訊息將從本機移除。若想保留，請先匯出完整備份。','刪除對話'))await change(d=>{C.deleteThread(d,thread.id);},'對話已刪除');
 if(name==='new-character')modal('新的相遇',inputField('角色名字','name')+inputField('起始世界','world','日常')+'<p class="hint">建立後可以補上人設、頭像與參考資料。新角色不會帶入其他人的聊天記憶。</p>',{label:'建立角色',submit:async f=>{if(!await change(d=>{const cid=C.id(),wid=C.id();d.characters.push({id:cid,name:String(f.get('name')).trim(),description:'',persona:'',avatar:''});d.worlds.push({id:wid,characterId:cid,name:String(f.get('world')).trim(),instructions:'',memory:''});d.selected={characterId:cid,worldId:wid,threadId:null};},'角色已建立'))throw Error('建立失敗');view='profile';search='';drawer=false;render();}});
 if(name==='duplicate-character'){const p=C.characterPackage(w(),character.id,false);p.character.name=(p.character.name+' · 副本').slice(0,60);await change(d=>Object.assign(d,C.addPackage(d,p)),'已複製設定；沒有帶入聊天或世界記憶');}
 if(name==='delete-character'){if(w().characters.length===1){toast('至少要留一個角色。',true);return;}if(await confirmDialog('刪除「'+character.name+'」？','這個角色的所有世界、參考資料、記憶與聊天都會刪除。請先匯出備份。','刪除角色'))await change(d=>{const worlds=new Set(d.worlds.filter(x=>x.characterId===character.id).map(x=>x.id)),threads=new Set(d.threads.filter(t=>worlds.has(t.worldId)).map(t=>t.id));d.characters=d.characters.filter(c=>c.id!==character.id);d.worlds=d.worlds.filter(x=>!worlds.has(x.id));d.threads=d.threads.filter(t=>!threads.has(t.id));d.messages=d.messages.filter(m=>!threads.has(m.threadId));d.references=d.references.filter(r=>!worlds.has(r.worldId));const c=d.characters[0],x=d.worlds.find(x=>x.characterId===c.id);d.selected={characterId:c.id,worldId:x.id,threadId:d.threads.find(t=>t.worldId===x.id)?.id||null};},'角色已刪除');}
 if(name==='new-world')modal('另一個世界',inputField('世界 / IF 線名稱','name')+inputField('這個世界的設定','instructions','',5),{label:'建立世界',submit:async f=>{if(!await change(d=>{const id=C.id();d.worlds.push({id,characterId:character.id,name:String(f.get('name')).trim(),instructions:String(f.get('instructions')),memory:''});d.selected={characterId:character.id,worldId:id,threadId:null};},'世界已建立，記憶從空白開始'))throw Error('建立失敗');search='';render();}});
 if(name==='edit-world')modal('編輯世界 · '+world.name,inputField('名稱','name',world.name)+inputField('世界設定','instructions',world.instructions,5)+inputField('手動記憶筆記','memory',world.memory,6)+'<p class="hint">只有這個世界會讀到這份記憶。這版不會自動整理或生成長期記憶。</p>',{submit:async f=>{if(!await change(d=>Object.assign(d.worlds.find(x=>x.id===world.id),{name:String(f.get('name')).trim(),instructions:String(f.get('instructions')),memory:String(f.get('memory'))}),'世界設定已儲存'))throw Error('儲存失敗');}});
 if(name==='context'){const preview=providerPayloadPreview();modal('本次實際送出的模型資料',`<div class="notice">目前 Provider：${esc(preview.provider)} / ${esc(preview.model)}。下方已套用該 Provider 的實際字數預算與截斷規則；也就是送出時真正形成的 payload（不含 API key）。目前最多帶入最近 ${preview.contextMessages} 則訊息；這間房的單次回覆上限 ${preview.maxOutputTokens} tokens。</div><pre class="context-text">${esc(JSON.stringify(preview.payload,null,2))}</pre>`,{label:'看好了',cancel:false,wide:true});}
 if(name==='export-diaries'||name==='export-posts'){const rows=w().life[name==='export-diaries'?'diaries':'posts'].filter(r=>r.worldId===world.id).sort((a,b)=>String(a.date).localeCompare(String(b.date)));await exportText('little-'+name+'-'+safeFilePart(character.name)+'.md',rows.map(r=>'## '+r.date+' · '+r.author+'\n\n'+r.text+'\n'+(r.comments||[]).map(c=>c.author+'：'+c.text).join('\n')).join('\n\n---\n\n'));return;}
 if(name==='export-thread'&&thread){const text=['# '+thread.title,'','角色：'+character.name,'世界：'+world.name,'匯出時間：'+exportStamp(),'','---','',threadMarkdown(thread,character,world,{heading:2,includeMeta:false})].join('\n');await exportText('moonlit-thread-'+safeFilePart(character.name)+'-'+safeFilePart(world.name)+'-'+safeFilePart(thread.title)+'.md',text);}
 if(name==='export-world-story'){await exportText('moonlit-world-'+safeFilePart(character.name)+'-'+safeFilePart(world.name)+'.md',worldMarkdown(character,world));}
 if(name==='export-character-story'){modal('匯出角色完整紀錄',`<label class="checkbox"><input type="checkbox" name="chat" checked>全部聊天室劇情</label><label class="checkbox"><input type="checkbox" name="diaries" checked>角色日記</label><label class="checkbox"><input type="checkbox" name="posts" checked>角色動態與留言</label><label class="checkbox"><input type="checkbox" name="events" checked>行程與紀念日</label>`,{label:'匯出 Markdown',submit:async form=>{const keys=['diaries','posts','events'].filter(k=>form.has(k));if(!form.has('chat')&&!keys.length)throw Error('至少選擇一項。');const parts=[form.has('chat')?characterMarkdown(character):'# '+character.name+'｜完整紀錄'];for(const world of w().worlds.filter(x=>x.characterId===character.id)){const rows=keys.flatMap(k=>w().life[k].filter(r=>r.worldId===world.id).map(r=>({...r,section:k}))).sort((a,b)=>String(a.date).localeCompare(String(b.date)));if(rows.length)parts.push('## '+world.name+'｜生活紀錄',...rows.map(r=>'### '+r.date+' · '+({diaries:'日記',posts:'動態',events:'行程'}[r.section])+(r.author?' · '+r.author:'')+'\n\n'+r.text+'\n'+(r.comments||[]).map(c=>c.author+'：'+c.text).join('\n')));}if(!await exportText('little-character-records-'+safeFilePart(character.name)+'.md',parts.join('\n\n')))throw Error('匯出失敗。');}});return;}
 if(name==='export-backup'){try{await exportJSON('moonlit-chat-backup',C.backup(w()));}catch(e){toast(e.message,true);}}
 if(name==='export-character')await exportJSON('moonlit-character',C.characterPackage(w(),character.id,$('#include-history').checked));
}
function safeFilePart(value){return String(value||'chat').normalize('NFKC').replace(/[\\/:*?"<>|\x00-\x1F]/g,'-').replace(/\s+/g,' ').trim().slice(0,40)||'chat';}
async function exportText(name,body){try{if(new TextEncoder().encode(body).byteLength>30000000)throw Error('匯出文字超過 30 MB。');if(globalThis.__TAURI__?.core?.invoke){const path=await __TAURI__.core.invoke('save_text_export',{name,body});toast('已存到：'+path);}else{const url=URL.createObjectURL(new Blob([body],{type:'text/markdown;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);toast('劇情匯出已開始。');}return true;}catch(e){toast(e.message,true);return false;}}
async function readJSON(file){if(!file)throw Error('沒有選擇檔案。');if(file.size>30000000)throw Error('本版單一匯入檔上限 30 MB。');try{return JSON.parse(await file.text());}catch{throw Error('檔案不是有效的 JSON。');}}
async function exportJSON(prefix,data,exactName=null,raise=false){try{const body=JSON.stringify(data),name=exactName||prefix+'-'+new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')+'.json';if(new TextEncoder().encode(body).byteLength>30000000)throw Error('本版單一備份檔上限 30 MB。');if(globalThis.__TAURI__?.core?.invoke){const path=await __TAURI__.core.invoke('save_export',{name,body});toast('已存到：'+path);}else{const url=URL.createObjectURL(new Blob([body],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);toast('備份下載已開始，請確認瀏覽器的下載項目。');}return true;}catch(e){toast(e.message,true);if(raise)throw e;return false;}}
async function importBackup(e){const file=e.target.files[0];e.target.value='';if(!file)return;try{const source=await readJSON(file),next=C.readBackup(source);if(!await confirmDialog('還原聊天室備份？',`會還原 ${next.characters.length} 位角色、${next.worlds.length} 個世界、${next.messages.length} 則訊息。${source.format==='moonlit-home-backup'?'這是舊版月光小屋整包備份；其中故事館資料會忽略。':''}建議先匯出目前的聊天室備份。`,'取代並還原'))return;if(await change(d=>{for(const k of Object.keys(d))delete d[k];Object.assign(d,next);},'聊天室備份已還原')){drafts.clear();replyDrafts.clear();search='';view='chat';render();}}catch(err){toast(err.message,true);}}
async function importPackage(e){const file=e.target.files[0];e.target.value='';if(!file)return;try{const p=await readJSON(file);const checked=C.addPackage(C.copy(w()),p),c=checked.characters.at(-1);if(!await confirmDialog('加入角色包？',`新增「${esc(c.name)}」。這份資料包含 ${p.worlds.length} 個世界、${p.messages.length} 則訊息。現有角色會保留。`,'加入角色'))return;if(await change(d=>Object.assign(d,C.addPackage(d,p)),'角色包已加入')){search='';view='profile';render();}}catch(err){toast(err.message,true);}}
async function uploadAvatar(e){const f=e.target.files[0];if(!f)return;try{if(!['image/png','image/jpeg','image/webp'].includes(f.type)||f.size>1500000)throw Error('請使用 1.5 MB 內的 PNG、JPG 或 WebP 圖片。');const value=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error('無法讀取圖片'));r.readAsDataURL(f);});const cid=scope().character.id;await change(d=>{d.characters.find(c=>c.id===cid).avatar=value;},'頭像已儲存');}catch(err){toast(err.message,true);}}
async function uploadReference(e){
 const files=Array.from(e.target.files);e.target.value='';if(!files.length)return;
 if(busy){toast('正在儲存，請稍後再加入參考資料。',true);return;}
 const {world}=scope(),wid=world.id,worldName=world.name;
 busy=true;document.body.classList.add('working');
 try{
  if(files.length+w().references.length>1000)throw Error('參考資料總數上限 1,000 份；這批尚未加入。');
  for(const f of files)if(!/\.(txt|md)$/i.test(f.name)||f.size>1000000)throw Error('「'+f.name+'」不符合限制：請使用 1 MB 內的 TXT 或 MD。這批尚未加入。');
  if(files.reduce((sum,f)=>sum+f.size,0)>20000000)throw Error('這批檔案合計超過 20 MB，請減少檔案後重試。這批尚未加入。');
  const references=await Promise.all(files.map(async f=>{const content=await f.text();if(content.length>250000)throw Error('「'+f.name+'」超過每份 250,000 字的上限。這批尚未加入。');return {id:C.id(),worldId:wid,name:f.name.slice(0,200),content};}));
  await service.change(d=>{if(!d.worlds.some(x=>x.id===wid))throw Error('原本選擇的世界已不存在，這批尚未加入。');d.references.push(...references);});
  toast('已一次加入 '+references.length+' 份參考資料至「'+worldName+'」。');
 }catch(err){toast(err.message||'讀取失敗，這批尚未加入。',true);}
 finally{busy=false;document.body.classList.remove('working');render();}
}
async function init(){try{repo=await ChatStorage.open();let data=await repo.load();if(!data){data=C.seed();await repo.save(data);}else{data=C.validate(data);}service=new C.WorkspaceService(repo,data);render();setTimeout(runDailyLife,0);}catch(e){$('#app').innerHTML=`<main class="fatal"><span class="brand-icon">${icon('moon')}</span><h1>本機資料暫時無法開啟</h1><p>${esc(e.message)}</p><p>請確認 Safari 允許網站儲存，再重新整理。</p><button class="button primary" onclick="location.reload()">重新整理</button></main>`;}}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&drawer){drawer=false;render();}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)runDailyLife();});
function updateViewport(){const v=window.visualViewport;const root=document.documentElement;root.style.setProperty('--visible-height',Math.round(v?.height||window.innerHeight)+'px');root.style.setProperty('--visible-top',Math.max(0,Math.round(v?.offsetTop||0))+'px');}
window.visualViewport?.addEventListener('scroll',updateViewport);
window.visualViewport?.addEventListener('resize',updateViewport);window.addEventListener('resize',updateViewport);updateViewport();
init();
})();
</script></body></html>
